name: 功能建议
description: 新能力或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 不涉及绕过任何在线游戏服务条款
          required: true
