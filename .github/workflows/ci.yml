name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    env:
      # 无头环境：感知走 mock、动作走 dry-run，不碰键鼠与其他服务。
      UGF_DRY_RUN: '1'
      UGF_PERCEPTION_BACKEND: 'mock'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 单元测试
        run: python -m pytest tests/ -q

      - name: 端到端自检（离线全链路）
        run: python agent.py selftest

      - name: 静态检查（不阻断）
        run: pip install ruff && ruff check . || true
