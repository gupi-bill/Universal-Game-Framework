# Universal-Game-Framework 游戏档案 florr.yaml
# ====================================
# v0.9 —— 每个游戏一份档案。核心模块(predictor/combat_judge/agent_main)只认这些
# 键的语义，不认具体游戏名。切换游戏 = 设 AGENT_GAME 指向另一份档案，核心零改动。
#
# 优先级：DEFAULT 兜底 < config.yaml(通用项) < 本档案(游戏专属项)。
# config.py 启动/热加载时读取 AGENT_GAME(=config.yaml 里 agent.game) 合并本档案。

# 游戏元信息
game:
  name: florr
  description: Florr.io 网页游戏，花瓣对战、吃莲花升级、组队打 BOSS。

# 实体分类（Florr.io 原生稀有度体系）
# 体系: Common < Unusual < Rare < Epic < Legendary < Mythic < Ultra < Super < Unique = Eternal
predictor:
  rarity_highest_boss: ["Unique", "Eternal"]   # 最高威胁，紧急避险
  rarity_boss: ["Super"]                       # 普通 BOSS
  rarity_elite: ["Ultra", "Mythic", "Legendary", "Epic"]
  rarity_normal: ["Rare", "Unusual", "Common"]
  # 分类 -> 威胁分数（战斗评估也用 threat 值判断打/跑/追）
  threat:
    highest_boss: 1000
    boss: 400
    elite: 120
    normal: 15
    player_enemy: 150
    player_ally: 0
    unknown: 5

# 感知端口：每款游戏一个端口，多游戏并行时不会都挤在 5001
#（florr 用默认 5001；space_invaders 用 5011）
server:
  perception_port: 5001

combat:
  chase_min_category: elite      # 追击套最低怪物档次（默认取本档案的高价值怪）
  default_set: combat            # 必须出现在下面的 sets 里
  # 套装清单：与 combat_judge 的 recommended_set、mcp_server.switch_set 的键位映射
  #（combat→1 / tank→2 / retreat→3 / chase→4 / team→5）保持同名，否则换套会落到「未知套装」
  sets:
    - combat                     # 常规输出
    - tank                       # 高威胁缠斗，保命优先
    - retreat                    # 逃生跑图
    - chase                      # 追击高价值怪
    - team                       # 组队辅助
  # 战术模板（会写进知识库，供决策时检索引用）
  tactics:
    - "低血量且附近有 Ultra 及以上怪物时立即切 retreat，不要恋战"
    - "Unique/Eternal 级 BOSS 出现即避战，等其转移或队友吸引仇恨后再回场"
    - "Mythic/Legendary 在血量充足且距离安全时可主动 chase，注意留一个位移技能"
    - "组队时优先保护队友输出位，team 套的收益高于个人击杀数"